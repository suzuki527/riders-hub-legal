<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rider's Hub｜規約とプライバシー</title>
<style>
:root{
  --base:#EAF1F5; --panel:#FFFFFF; --line:#D6E2EA;
  --ink:#17293A; --body:#4C6377; --muted:#7A8FA0; --blue:#1E85B8;
}
@media (prefers-color-scheme:dark){
  :root{
    --base:#10171E; --panel:#1A2430; --line:#31404E;
    --ink:#E8EEF3; --body:#B9C7D2; --muted:#8DA0AE; --blue:#4FAEDD;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--base); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",
    "Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP","Segoe UI",sans-serif;
  line-height:1.9; -webkit-text-size-adjust:100%;
}
.wrap{max-width:760px; margin:0 auto; padding:clamp(24px,5vw,56px) clamp(16px,5vw,32px) 96px}
header{border-bottom:1px solid var(--line); padding-bottom:20px; margin-bottom:32px}
.brand{
  font-size:12px; font-weight:700; letter-spacing:.2em; color:var(--blue);
  text-transform:uppercase; text-decoration:none; display:inline-block;
}
h1{font-size:clamp(24px,5vw,32px); font-weight:800; letter-spacing:-.01em; margin:10px 0 8px; line-height:1.4}
.meta{font-size:13px; color:var(--muted); margin:0}
h2{
  font-size:17px; font-weight:800; margin:36px 0 12px; padding-top:8px;
  border-top:1px solid var(--line); line-height:1.6;
}
h3{font-size:15px; font-weight:700; margin:24px 0 8px; color:var(--body)}
p,li{color:var(--ink); font-size:15px}
ol,ul{padding-left:1.6em; margin:12px 0}
li{margin-bottom:8px}
strong{font-weight:700}
table{
  width:100%; border-collapse:collapse; margin:14px 0; font-size:14px;
  display:block; overflow-x:auto; white-space:nowrap;
}
@media (min-width:600px){table{display:table; white-space:normal}}
th,td{border:1px solid var(--line); padding:9px 12px; text-align:left; vertical-align:top}
th{background:var(--panel); font-weight:700; font-size:13px; color:var(--body)}
footer{
  margin-top:56px; padding-top:24px; border-top:1px solid var(--line);
  font-size:13px; color:var(--muted);
}
footer a{color:var(--blue)}
.nav{display:flex; gap:16px; flex-wrap:wrap; margin-top:12px; font-size:14px}
.nav a{color:var(--blue); text-decoration:none; font-weight:700}
.nav a:hover{text-decoration:underline}
.card{
  background:var(--panel); border:1px solid var(--line); border-radius:12px;
  padding:20px 22px; margin:16px 0;
}
.card h2{border-top:none; margin-top:0; padding-top:0}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="brand">Rider&rsquo;s Hub</span>
  <h1>規約とプライバシー</h1>
  <p class="meta">ツーリングラリーアプリ「Rider&rsquo;s Hub」</p>
</header>
<div class="card">
  <h2><a href="terms.html" style="color:var(--blue);text-decoration:none">利用規約 →</a></h2>
  <p>本サービスの利用条件です。安全な運転、緊急時の対応、投稿、大会への参加について定めています。</p>
</div>
<div class="card">
  <h2><a href="privacy.html" style="color:var(--blue);text-decoration:none">プライバシーポリシー →</a></h2>
  <p>取得する情報とその使い方です。位置情報は画面表示中のみ取得し、バックグラウンドでの追跡は行いません。</p>
</div>
<footer>
  <p>ゲンバシステムズ株式会社　石川県羽咋市石野町へ4<br>
  お問い合わせ：<a href="mailto:hello@genbasys.com">hello@genbasys.com</a></p>
</footer>
</div>
</body>
</html>
